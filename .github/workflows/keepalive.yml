name: Supabase keepalive

on:
  schedule:
    - cron: '0 0 * * 1,4'   # 매주 월·목 오전 9시(한국 시간)
  workflow_dispatch:         # 직접 실행 버튼

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Supabase
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" \
            "https://idjymuakmnvpkhheybum.supabase.co/rest/v1/mandalart_data?select=user_id&limit=1" \
            -H "apikey: sb_publishable_mGweuspUerM0WsLBHoGkZw_5rk1bY-5"
